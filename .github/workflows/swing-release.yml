name: Swing Lab reviewed release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish or repair
        required: true
        default: v3.19.0
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract application source
        run: python -m zipfile -e swing-lab-v3-source.zip source
      - name: Build update assets
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, json
          found=[p for p in pathlib.Path('.').rglob('build_update_release.py') if (p.parent/'app.py').exists() and (p.parent/'BUILD_MANIFEST.json').exists()]
          if len(found)!=1:raise SystemExit('Expected one application source directory')
          builder=found[0]
          version=json.loads((builder.parent/'BUILD_MANIFEST.json').read_text())['version']
          if os.environ['RELEASE_TAG']!='v'+version:raise SystemExit('Tag and application version differ')
          subprocess.run(['python',str(builder),'--output','release-assets'],check=True)
          PY
      - name: Publish regular release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/release.json release-assets/swing-lab-v3-update.zip --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/release.json release-assets/swing-lab-v3-update.zip --verify-tag --title "Swing Lab $RELEASE_TAG" --generate-notes --latest
          fi
